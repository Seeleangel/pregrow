            <button id="proof-image-preview-close" class="absolute right-3 top-3 inline-flex h-11 w-11 items-center justify-center rounded-full bg-black/60 text-white hover:bg-black/75 transition-colors" type="button" aria-label="关闭预览">

            </button>
            <img id="proof-image-preview" class="max-h-[78vh] w-full rounded-md object-contain bg-black/5 dark:bg-white/5" alt="材料图片预览" />

    <script>
        let currentTeacherId = null;
        let currentSubmissions = [];
        const selectedSubmissionIds = new Set();

        function isImageProofUrl(url) {
            if (!url) return false;
            const lowerUrl = String(url).toLowerCase();
            return /\.(png|jpe?g|gif|webp|bmp|svg)(\?.*)?$/.test(lowerUrl)
                || lowerUrl.includes('/storage/v1/object/public/')
                || lowerUrl.includes('/uploads/')
                || lowerUrl.startsWith('data:image/');
        }

        function openProofImagePreview(url) {
            const modal = document.getElementById('proof-image-preview-modal');
            const image = document.getElementById('proof-image-preview');
            if (!modal || !image || !url) return;
            image.src = url;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeProofImagePreview() {
            const modal = document.getElementById('proof-image-preview-modal');
            const image = document.getElementById('proof-image-preview');
            if (!modal || !image) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            image.src = '';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            currentTeacherId = typeof getSessionUserId === 'function' ? getSessionUserId() : null;

            if (currentTeacherId && typeof hydrateTeacherIdentity === 'function') {
                hydrateTeacherIdentity({
                    teacherId: currentTeacherId,
                    brandContextElementId: 'brand-context',
                    subtitleElementId: 'header-class-context',
                    subtitleSuffix: '最新提交审核与批量处理',
                    avatarElementId: 'teacher-avatar',
                    nameElementId: 'teacher-name'
                });
            }

            const selectAll = document.getElementById('select-all-submissions');
            const batchVerifyBtn = document.getElementById('batch-verify-btn');
            const batchRejectBtn = document.getElementById('batch-reject-btn');

            if (selectAll) {
                selectAll.addEventListener('change', (event) => {
                    const checked = Boolean(event.target?.checked);
                    selectedSubmissionIds.clear();
                    if (checked) {
                        currentSubmissions
                            .filter((item) => item.status === 'submitted')
                            .forEach((item) => selectedSubmissionIds.add(String(item.id)));
                    }
                    renderSelectionState();
                    fetchSubmissions(false);
                });
            }

            if (batchVerifyBtn) {
                batchVerifyBtn.addEventListener('click', () => reviewSelected('verified'));
            }
            if (batchRejectBtn) {
                batchRejectBtn.addEventListener('click', () => reviewSelected('rejected'));
            }

            const proofPreviewModal = document.getElementById('proof-image-preview-modal');
            const proofPreviewClose = document.getElementById('proof-image-preview-close');
            if (proofPreviewClose) {
                proofPreviewClose.addEventListener('click', closeProofImagePreview);
            }
            if (proofPreviewModal) {
                proofPreviewModal.addEventListener('click', (event) => {
                    if (event.target === proofPreviewModal) {
                        closeProofImagePreview();
                    }
                });
            }
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeProofImagePreview();
                }
            });

            await fetchSubmissions();
        });

        function getStatusColor(status) {
            if (status === 'completed' || status === 'verified') return 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-200';
            if (status === 'rejected') return 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-200';
            return 'bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-200';
        }

        function getStatusText(status) {
            if (status === 'completed' || status === 'verified') return '已通过';
            if (status === 'rejected') return '已驳回';
            return '待审核';
        }

        function formatDateTime(value) {
            if (!value) return '--';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '--' : date.toLocaleString();
        }

        function getSubmissionTimeMeta(item) {
            const status = String(item?.status || '').toLowerCase();
            const reviewedAt = item?.reviewed_at || item?.updated_at || null;
            const submittedAt = item?.submitted_at || item?.completed_at || item?.created_at || null;

            if ((status === 'completed' || status === 'verified') && reviewedAt) {
                return { label: '审核通过', value: reviewedAt };
            }

            if (status === 'rejected' && reviewedAt) {
                return { label: '审核驳回', value: reviewedAt };
            }

            return { label: '提交时间', value: submittedAt };
        }

        function renderSelectionState() {
            const batchVerifyBtn = document.getElementById('batch-verify-btn');
            const batchRejectBtn = document.getElementById('batch-reject-btn');
            const hasSelection = selectedSubmissionIds.size > 0;
            if (batchVerifyBtn) batchVerifyBtn.disabled = !hasSelection;
            if (batchRejectBtn) batchRejectBtn.disabled = !hasSelection;
        }

        function updateMetricsFromSubmissions(submissions) {
            const pendingEl = document.getElementById('metric-pending');
            const verifiedEl = document.getElementById('metric-verified');
            const rejectedEl = document.getElementById('metric-rejected');
            const rows = Array.isArray(submissions) ? submissions : [];

            const now = new Date();
            const isToday = (raw) => {
                if (!raw) return false;
                const date = new Date(raw);
                return date.toDateString() === now.toDateString();
            };

            const pendingCount = rows.filter((item) => item.status === 'submitted').length;
            const verifiedTodayCount = rows.filter((item) => (item.status === 'completed' || item.status === 'verified') && isToday(item.reviewed_at || item.updated_at)).length;
            const rejectedTodayCount = rows.filter((item) => item.status === 'rejected' && isToday(item.reviewed_at || item.updated_at)).length;

            if (pendingEl) pendingEl.textContent = String(pendingCount);
            if (verifiedEl) verifiedEl.textContent = String(verifiedTodayCount);
            if (rejectedEl) rejectedEl.textContent = String(rejectedTodayCount);
        }

        function setRowReviewLoading(triggerButton, isLoading) {
            if (!triggerButton) return;
            const row = triggerButton.closest('tr');
            if (!row) return;

            const rowButtons = row.querySelectorAll('button[data-review-action]');
            rowButtons.forEach((btn) => {
                if (isLoading) {
                    btn.disabled = true;
                    btn.classList.add('opacity-70', 'cursor-not-allowed');
                    if (btn === triggerButton) {
                        btn.dataset.originalHtml = btn.innerHTML;
                        btn.innerHTML = '<span class="inline-flex items-center gap-1"><span class="material-icons text-sm animate-spin">autorenew</span>处理中...</span>';
                    }
                } else {
                    btn.disabled = false;
                    btn.classList.remove('opacity-70', 'cursor-not-allowed');
                    if (btn.dataset.originalHtml) {
                        btn.innerHTML = btn.dataset.originalHtml;
                        delete btn.dataset.originalHtml;
                    }
                }
            });
        }

        function setBatchReviewLoading(action, isLoading) {
            const verifyBtn = document.getElementById('batch-verify-btn');
            const rejectBtn = document.getElementById('batch-reject-btn');
            const activeBtn = action === 'verified' ? verifyBtn : rejectBtn;
            const passiveBtn = action === 'verified' ? rejectBtn : verifyBtn;

            if (isLoading) {
                if (activeBtn) {
                    activeBtn.dataset.originalHtml = activeBtn.innerHTML;
                    activeBtn.innerHTML = '<span class="inline-flex items-center gap-1"><span class="material-icons text-sm animate-spin">autorenew</span>处理中...</span>';
                    activeBtn.disabled = true;
                }
                if (passiveBtn) {
                    passiveBtn.disabled = true;
                }
                return;
            }

            if (verifyBtn?.dataset.originalHtml) {
                verifyBtn.innerHTML = verifyBtn.dataset.originalHtml;
                delete verifyBtn.dataset.originalHtml;
            }
            if (rejectBtn?.dataset.originalHtml) {
                rejectBtn.innerHTML = rejectBtn.dataset.originalHtml;
                delete rejectBtn.dataset.originalHtml;
            }
            renderSelectionState();
        }

        function ensureSubmissionRowsPlaceholder() {
            const tbody = document.getElementById('submissions-table-body');
            if (!tbody) return;
            const remainingRows = tbody.querySelectorAll('tr[data-submission-row]').length;
            if (remainingRows > 0) return;
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-5 text-center text-sm text-text-sub-light dark:text-text-sub-dark">暂无提交记录</td></tr>';
        }

        function flashReviewedRow(submissionId, action) {
            const row = document.querySelector(`tr[data-submission-row="${submissionId}"]`);
            if (!row) return;
            const highlightClass = action === 'verified' ? 'bg-green-50' : 'bg-red-50';
            row.classList.add('transition-colors', 'duration-500', highlightClass);
            setTimeout(() => {
                row.classList.remove(highlightClass);
            }, 900);
        }

        function applySingleReviewToRow(submissionId, action) {
            const row = document.querySelector(`tr[data-submission-row="${submissionId}"]`);
            if (!row) return;

            const nextStatus = action === 'verified' ? 'completed' : 'rejected';
            const statusEl = row.querySelector('[data-submission-status]');
            const actionsEl = row.querySelector('[data-submission-actions]');

            if (statusEl) {
                statusEl.className = `px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(nextStatus)}`;
                statusEl.textContent = getStatusText(nextStatus);
            }
            if (actionsEl) {
                actionsEl.innerHTML = '<span class="text-xs text-text-sub-light dark:text-text-sub-dark">已处理</span>';
            }
        }

        function applySingleReviewToCache(submissionId, action) {
            const nextStatus = action === 'verified' ? 'completed' : 'rejected';
            const reviewedAt = new Date().toISOString();
            const targetId = String(submissionId);
            currentSubmissions = (Array.isArray(currentSubmissions) ? currentSubmissions : []).map((item) => {
                if (String(item.id) !== targetId) return item;
                return {
                    ...item,
                    status: nextStatus,
                    reviewed_at: reviewedAt,
                    updated_at: reviewedAt,
                    history_at: reviewedAt
                };
            });
        }

        function applyBatchReviewToUi(submissionIds, action) {
            (Array.isArray(submissionIds) ? submissionIds : []).forEach((id) => {
                applySingleReviewToRow(id, action);
                applySingleReviewToCache(id, action);
                flashReviewedRow(id, action);
                selectedSubmissionIds.delete(String(id));
            });
            renderSelectionState();
            updateMetricsFromSubmissions(currentSubmissions);
        }

        function renderLoadingRows() {

                                            <div class="w-4 h-4 rounded border-[#efebe0] dark:border-[#4a4238] mx-auto bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                        </td>
                                        <td class="px-6 py-4 flex items-center gap-3">
                                            <div class="h-8 w-8 rounded-full bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                            <div class="h-4 outline-none w-16 rounded bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="space-y-2">
                                                <div class="h-3 outline-none w-20 rounded bg-[#efebe0] dark:bg-[#4a4238]"></div>

                                        </td>
                                    </tr>
                                    <!-- Skeleton 2 -->
                                    <tr class="animate-pulse">
                                        <td class="px-4 py-4 text-center">
                                            <div class="w-4 h-4 rounded border-[#efebe0] dark:border-[#4a4238] mx-auto bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                        </td>
                                        <td class="px-6 py-4 flex items-center gap-3">
                                            <div class="h-8 w-8 rounded-full bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                            <div class="h-4 outline-none w-20 rounded bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="space-y-2">
                                                <div class="h-3 outline-none w-24 rounded bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                                <div class="h-2 outline-none w-16 rounded bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="h-5 w-14 rounded-full bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="h-3 outline-none w-20 rounded bg-[#efebe0] dark:bg-[#4a4238]"></div>

                                        <td class="px-6 py-4 text-right">
                                            <div class="h-6 w-20 rounded bg-[#efebe0] dark:bg-[#4a4238] ml-auto"></div>
                                        </td>
                                    </tr>
                                    <!-- Skeleton 3 -->
                                    <tr class="animate-pulse">
                                        <td class="px-4 py-4 text-center">
                                            <div class="w-4 h-4 rounded border-[#efebe0] dark:border-[#4a4238] mx-auto bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                        </td>
                                        <td class="px-6 py-4 flex items-center gap-3">
                                            <div class="h-8 w-8 rounded-full bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                            <div class="h-4 outline-none w-14 rounded bg-[#efebe0] dark:bg-[#4a4238]"></div>
                                        </td>
                                        <td class="px-6 py-4">

        async function fetchSubmissions(resetSelection = true) {
            const tbody = document.getElementById('submissions-table-body');
            const pendingEl = document.getElementById('metric-pending');
            const verifiedEl = document.getElementById('metric-verified');
            const rejectedEl = document.getElementById('metric-rejected');
            if (!tbody) return;

            renderLoadingRows();

            if (resetSelection) {
                selectedSubmissionIds.clear();
            }
            renderSelectionState();

            try {
                const queryParams = new URLSearchParams({
                    limit: '100',
                    history: 'all'
                });
                if (currentTeacherId) {
                    queryParams.set('teacher_id', currentTeacherId);
                }

                const query = `?${queryParams.toString()}`;
                const res = await apiFetch(API_BASE_URL + `/api/submissions${query}`);
                if (!res.ok) throw new Error('Failed to fetch submissions');

                const submissions = await res.json();
                currentSubmissions = Array.isArray(submissions) ? submissions : [];
                if (!Array.isArray(submissions) || submissions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-5 text-center text-sm text-text-sub-light dark:text-text-sub-dark">暂无提交记录</td></tr>';
                    if (pendingEl) pendingEl.textContent = '0';
                    if (verifiedEl) verifiedEl.textContent = '0';
                    if (rejectedEl) rejectedEl.textContent = '0';
                    return;
                }

                updateMetricsFromSubmissions(submissions);

                const selectAll = document.getElementById('select-all-submissions');
                if (selectAll) {
                    const pendingIds = submissions
                        .filter((item) => item.status === 'submitted')
                        .map((item) => String(item.id));
                    const allSelected = pendingIds.length > 0 && pendingIds.every((id) => selectedSubmissionIds.has(id));
                    selectAll.checked = allSelected;
                }

                tbody.innerHTML = submissions.map((item) => {
                    const studentName = item.student_name || item.profiles?.full_name || '未知学生';
                    const avatarUrl = item.student_avatar || item.profiles?.avatar_url;
                    const avatar = avatarUrl
                        ? `<img class="w-8 h-8 rounded-full object-cover" src="${escapeHtml(avatarUrl)}" alt="${escapeHtml(studentName)}的头像" loading="lazy" />`
                        : `<div class="w-8 h-8 rounded-full bg-primary/20 text-primary text-xs font-bold flex items-center justify-center">${escapeHtml(studentName[0] || '学')}</div>`;
                    const canReview = item.status === 'submitted';
                    const checked = selectedSubmissionIds.has(String(item.id)) ? 'checked' : '';
                    const proofNote = String(item.proof_note || '').trim();
                    const proofUrl = String(item.proof_url || '').trim();
                    const proofIsImage = isImageProofUrl(proofUrl);
                    const timeMeta = getSubmissionTimeMeta(item);
                    const proofHtml = (proofNote || proofUrl)
                        ? `<div class="mt-2 text-xs text-text-sub-light dark:text-text-sub-dark space-y-2">${proofNote ? `<div>说明：${escapeHtml(proofNote)}</div>` : ''}${proofUrl ? (proofIsImage
                            ? `<button type="button" data-proof-preview-url="${escapeHtml(proofUrl)}" class="group inline-flex items-center gap-2 rounded-lg border border-[#efebe0] dark:border-[#4a4238] bg-[#fdfbf7] dark:bg-[#2b2520] px-2 py-1 hover:border-primary/60 transition-colors"><img src="${escapeHtml(proofUrl)}" alt="${escapeHtml(studentName)}提交的材料缩略图" class="h-12 w-12 rounded object-cover border border-[#efebe0] dark:border-[#4a4238]" loading="lazy" /><span class="inline-flex items-center gap-1 text-primary group-hover:text-primary-dark"><span class="material-icons text-sm">zoom_in</span>预览材料</span></button>`
                            : `<a class="inline-flex items-center gap-1 text-primary hover:text-primary-dark" href="${escapeHtml(proofUrl)}" rel="noopener noreferrer"><span class="material-icons text-sm">link</span>查看材料链接</a>`
                        ) : ''}</div>`
                        : '<div class="mt-2 text-xs text-red-500">未提交材料</div>';

                    return `
                        <tr data-submission-row="${item.id}" class="hover:bg-secondary/20 dark:hover:bg-surface-light/5 transition-colors">
                            <td class="px-4 py-4 text-center">
                                ${canReview
                            ? `<input data-submission-check="${item.id}" type="checkbox" class="rounded border-[#efebe0] dark:border-[#4a4238]" ${checked} />`
                            : ''}
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    ${avatar}
                                    <span class="text-sm font-medium">${escapeHtml(studentName)}</span>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-sm text-text-main-light dark:text-text-main-dark">${escapeHtml(item.task_title || item.tasks?.title || '任务')}</div>
                                <div class="text-xs text-text-sub-light dark:text-text-sub-dark">${escapeHtml(item.task_type || item.tasks?.type || 'challenge')}</div>
                                ${proofHtml}
                            </td>
                            <td class="px-6 py-4">
                                <span data-submission-status class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(item.status)}">${getStatusText(item.status)}</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-text-sub-light dark:text-text-sub-dark">
                                <div>${formatDateTime(timeMeta.value)}</div>
                                <div class="mt-1 text-xs">${timeMeta.label}</div>
                            </td>
                            <td data-submission-actions class="px-6 py-4 text-right text-sm">
                                ${canReview
                            ? `<div class="flex items-center justify-end gap-2">
                                            <button data-review-action="verified" data-submission-id="${item.id}" class="px-3 py-1 rounded-lg bg-primary text-white hover:bg-primary-dark transition-colors">通过</button>
                                            <button data-review-action="rejected" data-submission-id="${item.id}" class="px-3 py-1 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 transition-colors">驳回</button>
                                       </div>`
                            : '<span class="text-xs text-text-sub-light dark:text-text-sub-dark">已处理</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');

                tbody.querySelectorAll('input[data-submission-check]').forEach((checkbox) => {
                    checkbox.addEventListener('change', (event) => {
                        const id = String(event.target.getAttribute('data-submission-check'));
                        if (event.target.checked) {
                            selectedSubmissionIds.add(id);
                        } else {
                            selectedSubmissionIds.delete(id);
                        }
                        renderSelectionState();
                    });
                });

                tbody.querySelectorAll('button[data-review-action]').forEach((btn) => {
                    btn.addEventListener('click', async () => {
                        const submissionId = String(btn.getAttribute('data-submission-id') || '');
                        const action = String(btn.getAttribute('data-review-action') || '');
                        if (!submissionId || !action) return;
                        await reviewSingle(submissionId, action, btn);
                    });
                });

                tbody.querySelectorAll('button[data-proof-preview-url]').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        const proofUrl = String(btn.getAttribute('data-proof-preview-url') || '').trim();
                        if (!proofUrl) return;
                        openProofImagePreview(proofUrl);
                    });
                });
            } catch (error) {
                console.error('Error fetching submissions:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-5 text-center text-sm text-red-500">提交记录加载失败，请稍后重试</td></tr>';
            }
        }

        async function reviewSingle(submissionId, action, triggerButton) {
            setRowReviewLoading(triggerButton, true);
            try {
                const res = await apiFetch(API_BASE_URL + `/api/submissions/${encodeURIComponent(submissionId)}/review`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '审核失败' }));
                    throw new Error(errorData.error || '审核失败');
                }
                selectedSubmissionIds.delete(String(submissionId));
                renderSelectionState();
                applySingleReviewToRow(submissionId, action);
                applySingleReviewToCache(submissionId, action);
                flashReviewedRow(submissionId, action);
                updateMetricsFromSubmissions(currentSubmissions);
                if (window.showPageToast) {
                    window.showPageToast(action === 'verified' ? '审核通过' : '已驳回该提交', 'success');
                }
                setTimeout(() => {
                    fetchSubmissions(false).catch((error) => {
                        console.error('Background refresh after single review failed:', error);
                    });
                }, 900);
            } catch (error) {
                console.error('Review single submission failed:', error);
                if (window.showPageToast) {
                    window.showPageToast(error.message || '审核失败，请稍后重试', 'error');
                }
            } finally {
                setRowReviewLoading(triggerButton, false);
            }
        }

        async function reviewSelected(action) {
            const ids = Array.from(selectedSubmissionIds);
            if (!ids.length) {
                if (window.showPageToast) {
                    window.showPageToast('请先选择要审核的提交', 'info');
                }
                return;
            }

            setBatchReviewLoading(action, true);
            try {
                const res = await apiFetch(API_BASE_URL + '/api/submissions/review-batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, submission_ids: ids })
                });
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '批量审核失败' }));
                    throw new Error(errorData.error || '批量审核失败');
                }
                selectedSubmissionIds.clear();
                applyBatchReviewToUi(ids, action);
                if (window.showPageToast) {
                    window.showPageToast(action === 'verified' ? '批量通过成功' : '批量驳回成功', 'success');
                }
                setTimeout(() => {
                    fetchSubmissions().catch((error) => {
                        console.error('Background refresh after batch review failed:', error);
                    });
                }, 1000);
            } catch (error) {
                console.error('Batch review submissions failed:', error);
                if (window.showPageToast) {
                    window.showPageToast(error.message || '批量审核失败，请稍后重试', 'error');
                }
            } finally {
                setBatchReviewLoading(action, false);
            }
        }
    </script>
    <script src="../shared/page-loading.js"></script>
