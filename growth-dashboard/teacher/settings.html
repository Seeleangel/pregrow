    <script>
        let currentTeacherId = null;

        function showStatus(statusElementId, message, type = 'info') {
            const statusEl = document.getElementById(statusElementId);
            if (!statusEl) return;

            statusEl.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'border', 'border-green-200', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
            if (type === 'success') {
                statusEl.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
            } else if (type === 'error') {
                statusEl.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
            } else {
                statusEl.classList.add('bg-blue-50', 'text-blue-700', 'border', 'border-blue-200');
            }
            statusEl.textContent = message;
        }

        function showClassStatus(message, type = 'info') {
            showStatus('settings-status', message, type);
        }

        function showProfileStatus(message, type = 'info') {
            showStatus('profile-status', message, type);
        }

        function getAvatarPreviewFallback() {
            return 'https://api.dicebear.com/7.x/notionists/svg?seed=teacher_profile_preview&backgroundColor=e6dac6';
        }

        function setAvatarPreview(url, isLocal = false) {
            const preview = document.getElementById('teacher-avatar-preview');
            const previewText = document.getElementById('teacher-avatar-preview-text');
            if (!preview) return;

            const fallback = getAvatarPreviewFallback();
            const finalUrl = String(url || '').trim() || fallback;
            preview.src = finalUrl;
            preview.onerror = () => {
                preview.onerror = null;
                preview.src = fallback;
            };

            if (previewText) {
                if (isLocal) {
                    previewText.textContent = '本地预览（待上传）';
                } else {
                    previewText.textContent = String(url || '').trim() ? '当前头像预览' : '头像预览';
                }
            }
        }

        function fillProfileForm(data) {
            const fullNameInput = document.getElementById('teacher-full-name-input');
            const avatarUrlInput = document.getElementById('teacher-avatar-url-input');
            const bioInput = document.getElementById('teacher-bio-input');

            if (fullNameInput) fullNameInput.value = data?.full_name || '';
            if (avatarUrlInput) avatarUrlInput.value = data?.avatar_url || '';
            if (bioInput) bioInput.value = data?.bio || '';
            setAvatarPreview(data?.avatar_url || '');
        }

        function fillClassForm(data) {
            const classNameInput = document.getElementById('class-name-input');
            const schoolNameInput = document.getElementById('school-name-input');
            const inviteCodeEl = document.getElementById('invite-code-text');

            if (classNameInput) classNameInput.value = data?.name || '';
            if (schoolNameInput) schoolNameInput.value = data?.school_name || '';
            if (inviteCodeEl) {
                // Clear the animated pulse skeleton div and set class and text directly
                inviteCodeEl.innerHTML = '';
                inviteCodeEl.className = 'flex-1 rounded-md bg-[#fdfbf7] dark:bg-[#2b2520] border border-[#efebe0] dark:border-[#4a4238] px-4 py-3 font-bold tracking-[0.2em] flex items-center animate-fade-in';
                inviteCodeEl.textContent = data?.invite_code || '无邀请码';
            }
        }

        function setInviteLoading() {
            const inviteCodeEl = document.getElementById('invite-code-text');
            if (!inviteCodeEl) return;
            inviteCodeEl.innerHTML = '<div class="h-6 w-32 bg-[#efebe0] dark:bg-[#4a4238] rounded animate-pulse"></div>';
        }

        async function fetchClassSettings() {
            if (!currentTeacherId) {
                showClassStatus('请先登录教师账号', 'error');
                return;
            }

            try {
                setInviteLoading();
                showClassStatus('正在加载班级信息...', 'info');
                const res = await apiFetch(API_BASE_URL + `/api/teacher/${encodeURIComponent(currentTeacherId)}/class`);
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '加载失败' }));
                    throw new Error(errorData.error || '加载失败');
                }
                const data = await res.json();
                fillClassForm(data);
                showClassStatus('班级信息加载完成', 'success');
            } catch (error) {
                console.error('Fetch class settings failed:', error);
                showClassStatus(error.message || '班级信息加载失败', 'error');
            }
        }

        async function fetchTeacherProfile() {
            if (!currentTeacherId) {
                showProfileStatus('请先登录教师账号', 'error');
                return;
            }

            try {
                showProfileStatus('正在加载个人信息...', 'info');
                const res = await apiFetch(API_BASE_URL + `/api/teacher/${encodeURIComponent(currentTeacherId)}/profile`);
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '加载失败' }));
                    throw new Error(errorData.error || '加载失败');
                }

                const data = await res.json();
                fillProfileForm(data || {});
                showProfileStatus('个人信息加载完成', 'success');
            } catch (error) {
                console.error('Fetch teacher profile failed:', error);
                showProfileStatus(error.message || '个人信息加载失败', 'error');
            }
        }

        async function saveTeacherProfile() {
            const fullNameInput = document.getElementById('teacher-full-name-input');
            const avatarUrlInput = document.getElementById('teacher-avatar-url-input');
            const bioInput = document.getElementById('teacher-bio-input');
            const saveBtn = document.getElementById('save-profile-btn');

            if (!fullNameInput || !avatarUrlInput || !bioInput || !saveBtn) return;

            const payload = {
                full_name: String(fullNameInput.value || '').trim(),
                avatar_url: String(avatarUrlInput.value || '').trim(),
                bio: String(bioInput.value || '').trim()
            };

            if (!payload.full_name) {
                showProfileStatus('请填写姓名', 'error');
                return;
            }

            if (payload.full_name.length < 3) {
                showProfileStatus('姓名至少需要 3 个字符', 'error');
                return;
            }

            if (payload.bio.length > 200) {
                showProfileStatus('个人简介最多 200 字', 'error');
                return;
            }

            if (!currentTeacherId) {
                showProfileStatus('请先登录教师账号', 'error');
                return;
            }

            saveBtn.disabled = true;
            const prevText = saveBtn.textContent;
            saveBtn.textContent = '保存中...';

            try {
                const res = await apiFetch(API_BASE_URL + `/api/teacher/${encodeURIComponent(currentTeacherId)}/profile`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '保存失败' }));
                    throw new Error(errorData.error || '保存失败');
                }

                const result = await res.json();
                fillProfileForm(result?.data || payload);
                showProfileStatus('个人信息保存成功', 'success');

                if (typeof hydrateTeacherIdentity === 'function') {
                    hydrateTeacherIdentity({
                        teacherId: currentTeacherId,
                        brandContextElementId: 'brand-context',
                        subtitleElementId: 'header-class-context',
                        subtitleSuffix: '班级基础信息与邀请码管理',
                        avatarElementId: 'teacher-avatar',
                        nameElementId: 'teacher-name'
                    });
                }
            } catch (error) {
                console.error('Save teacher profile failed:', error);
                showProfileStatus(error.message || '保存失败，请稍后重试', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = prevText;
            }
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = () => reject(new Error('读取图片失败'));
                reader.readAsDataURL(file);
            });
        }

        async function uploadTeacherAvatarFromFile(file) {
            if (!file) return;

            if (!String(file.type || '').startsWith('image/')) {
                showProfileStatus('仅支持图片文件', 'error');
                return;
            }

            const maxBytes = 5 * 1024 * 1024;
            if (Number(file.size || 0) > maxBytes) {
                showProfileStatus('鍥剧墖涓嶈兘瓒呰繃 5MB', 'error');
                return;
            }

            if (!currentTeacherId) {
                showProfileStatus('请先登录教师账号', 'error');
                return;
            }

            const uploadBtn = document.getElementById('upload-avatar-btn');
            if (uploadBtn) {
                uploadBtn.disabled = true;
                uploadBtn.textContent = '上传中...';
            }

            try {
                showProfileStatus('正在上传头像...', 'info');
                const dataBase64 = await readFileAsDataUrl(file);
                setAvatarPreview(dataBase64, true);

                const res = await apiFetch(API_BASE_URL + `/api/teacher/${encodeURIComponent(currentTeacherId)}/avatar/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fileName: file.name,
                        mimeType: file.type || 'image/png',
                        dataBase64
                    })
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '上传失败' }));
                    throw new Error(errorData.error || '上传失败');
                }

                const result = await res.json();
                const avatarUrlInput = document.getElementById('teacher-avatar-url-input');
                if (avatarUrlInput && result?.avatar_url) {
                    avatarUrlInput.value = result.avatar_url;
                }
                setAvatarPreview(result?.avatar_url || '');

                if (typeof hydrateTeacherIdentity === 'function') {
                    hydrateTeacherIdentity({
                        teacherId: currentTeacherId,
                        brandContextElementId: 'brand-context',
                        subtitleElementId: 'header-class-context',
                        subtitleSuffix: '班级基础信息与邀请码管理',
                        avatarElementId: 'teacher-avatar',
                        nameElementId: 'teacher-name'
                    });
                }

                showProfileStatus('头像上传成功，已自动填入头像链接', 'success');
            } catch (error) {
                console.error('Upload teacher avatar failed:', error);
                showProfileStatus(error.message || '头像上传失败，请稍后重试', 'error');
            } finally {
                if (uploadBtn) {
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '上传本地头像';
                }
            }
        }

        async function saveClassSettings() {
            const classNameInput = document.getElementById('class-name-input');
            const schoolNameInput = document.getElementById('school-name-input');
            const saveBtn = document.getElementById('save-class-btn');
            if (!classNameInput || !schoolNameInput || !saveBtn) return;

            const payload = {
                name: String(classNameInput.value || '').trim(),
                school_name: String(schoolNameInput.value || '').trim()
            };

            if (!payload.name || !payload.school_name) {
                showClassStatus('请完整填写班级名称和年级', 'error');
                return;
            }

            if (!currentTeacherId) {
                showClassStatus('请先登录教师账号', 'error');
                return;
            }

            saveBtn.disabled = true;
            const prevText = saveBtn.textContent;
            saveBtn.textContent = '保存中...';

            try {
                const res = await apiFetch(API_BASE_URL + `/api/teacher/${encodeURIComponent(currentTeacherId)}/class`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '保存失败' }));
                    throw new Error(errorData.error || '保存失败');
                }
                const result = await res.json();
                fillClassForm(result.data || payload);
                showClassStatus('班级信息保存成功', 'success');
            } catch (error) {
                console.error('Save class settings failed:', error);
                showClassStatus(error.message || '保存失败，请稍后重试', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = prevText;
            }
        }

        async function refreshInviteCode() {
            const refreshBtn = document.getElementById('refresh-invite-btn');
            if (!refreshBtn) return;

            if (!currentTeacherId) {
                showClassStatus('请先登录教师账号', 'error');
                return;
            }

            refreshBtn.disabled = true;
            const prevText = refreshBtn.textContent;
            refreshBtn.textContent = '刷新中...';

            try {
                setInviteLoading();
                const res = await apiFetch(API_BASE_URL + `/api/teacher/${encodeURIComponent(currentTeacherId)}/class/invite-code/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: '刷新失败' }));
                    throw new Error(errorData.error || '刷新失败');
                }
                const result = await res.json();
                fillClassForm(result.data || {});
                showClassStatus('邀请码已刷新', 'success');
            } catch (error) {
                console.error('Refresh invite code failed:', error);
                showClassStatus(error.message || '刷新失败，请稍后重试', 'error');
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = prevText;
            }
        }

        async function copyInviteCode() {
            const inviteCodeEl = document.getElementById('invite-code-text');
            if (!inviteCodeEl) return;
            const value = String(inviteCodeEl.textContent || '').trim();
            if (!value || value === '无邀请码' || value === '加载中...') {
                showClassStatus('暂无可复制的邀请码', 'error');
                return;
            }
            try {
                await navigator.clipboard.writeText(value);
                showClassStatus('邀请码已复制到剪贴板', 'success');
            } catch (error) {
                console.error('Copy invite code failed:', error);
                showClassStatus('复制失败，请手动复制', 'error');
            }
        }

        function scrollToProfileSectionIfNeeded() {
            const section = new URLSearchParams(window.location.search).get('section');
            if (section !== 'profile') return;

            const card = document.getElementById('profile-settings-card');
            if (!card) return;

            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            card.classList.add('ring-2', 'ring-primary/40');
            setTimeout(() => {
                card.classList.remove('ring-2', 'ring-primary/40');
            }, 1400);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            currentTeacherId = typeof getSessionUserId === 'function' ? getSessionUserId() : null;

            if (currentTeacherId && typeof hydrateTeacherIdentity === 'function') {
                hydrateTeacherIdentity({
                    teacherId: currentTeacherId,
                    brandContextElementId: 'brand-context',
                    subtitleElementId: 'header-class-context',
                    subtitleSuffix: '班级基础信息与邀请码管理',
                    avatarElementId: 'teacher-avatar',
                    nameElementId: 'teacher-name'
                });
            }

            const saveBtn = document.getElementById('save-class-btn');
            const saveProfileBtn = document.getElementById('save-profile-btn');
            const uploadAvatarBtn = document.getElementById('upload-avatar-btn');
            const avatarFileInput = document.getElementById('teacher-avatar-file-input');
            const avatarUrlInput = document.getElementById('teacher-avatar-url-input');
            const refreshBtn = document.getElementById('refresh-invite-btn');
            const copyBtn = document.getElementById('copy-invite-btn');

            if (saveBtn) saveBtn.addEventListener('click', saveClassSettings);
            if (saveProfileBtn) saveProfileBtn.addEventListener('click', saveTeacherProfile);
            if (uploadAvatarBtn && avatarFileInput) {
                uploadAvatarBtn.addEventListener('click', () => avatarFileInput.click());
                avatarFileInput.addEventListener('change', async (event) => {
                    const file = event.target?.files?.[0];
                    await uploadTeacherAvatarFromFile(file);
                    avatarFileInput.value = '';
                });
            }
            if (avatarUrlInput) {
                avatarUrlInput.addEventListener('change', () => {
                    setAvatarPreview(avatarUrlInput.value || '');
                });
            }
            if (refreshBtn) refreshBtn.addEventListener('click', refreshInviteCode);
            if (copyBtn) copyBtn.addEventListener('click', copyInviteCode);

            await fetchTeacherProfile();
            await fetchClassSettings();
            scrollToProfileSectionIfNeeded();
        });
    </script>
    <script src="../shared/page-loading.js"></script>
</body>

</html>
